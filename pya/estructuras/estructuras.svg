     xml:space="preserve"
     style="font-size:3.70417px;line-height:1.25;font-family:'Segoe UI';-inkscape-font-specification:'Segoe UI';text-align:center;text-anchor:middle;stroke-width:0.264583"
     x="330.72916"
     y="56.636963"
     id="text11"><tspan
       sodipodi:role="line"
       id="tspan11"
       style="stroke-width:0.264583"
       x="330.72916"
       y="56.636963">J</tspan></text><text
     xml:space="preserve"
     style="font-size:3.70417px;line-height:1.25;font-family:'Segoe UI';-inkscape-font-specification:'Segoe UI';text-align:center;text-anchor:middle;stroke-width:0.264583"
     x="1446.5363"
     y="143.27167"
     id="text26"><tspan
       sodipodi:role="line"
       id="tspan26"
       style="stroke-width:0.264583"
       x="1446.5363"
       y="143.27167" /></text><g
     id="g22"
     transform="translate(0,-7.9468476)"><text
       xml:space="preserve"
       style="font-size:11.2092px;line-height:1.25;font-family:'Segoe UI';-inkscape-font-specification:'Segoe UI';text-align:start;text-anchor:start;white-space:pre;inline-size:300.316;display:inline;stroke-width:0.800658"
       x="391.21085"
       y="71.250725"
       id="text6"
       transform="translate(-20.991221,-8.1396021)"><tspan
         x="391.21085"
         y="71.250725"
         id="tspan8">Un <tspan
   style="font-weight:bold"
   id="tspan7">pair</tspan> contiene dos datos. Al contrario de los </tspan><tspan
         x="391.21085"
         y="85.262226"
         id="tspan9">contenedores que revisamos hasta ahora, debemos proveer </tspan><tspan
         x="391.21085"
         y="99.273723"
         id="tspan10">dos tipos de datos. </tspan></text><text
       xml:space="preserve"
       style="font-size:11.2092px;line-height:1.25;font-family:'Segoe UI';-inkscape-font-specification:'Segoe UI';text-align:start;text-anchor:start;white-space:pre;inline-size:300.316;display:inline;stroke-width:0.800658"
       x="391.21085"
       y="71.250725"
       id="text22"
       transform="translate(50.508479,49.673655)"><tspan
         x="391.21085"
         y="71.250725"
         id="tspan13"><tspan
           style="font-weight:300;-inkscape-font-specification:'Segoe UI Light'"
           id="tspan12">pair&lt;string, string&gt; pString;
</tspan></tspan><tspan
         x="391.21085"
         y="85.262226"
         id="tspan15"><tspan
           style="font-weight:300;-inkscape-font-specification:'Segoe UI Light'"
           id="tspan14">pair&lt;string, int&gt; conteoPalabras;
</tspan></tspan><tspan
         x="391.21085"
         y="99.273723"
         id="tspan17"><tspan
           style="font-weight:300;-inkscape-font-specification:'Segoe UI Light'"
           id="tspan16">par&lt;string, vector&lt;int&gt;&gt; linea;</tspan></tspan></text></g><text
     xml:space="preserve"
     style="font-size:11.2092px;line-height:1.25;font-family:'Segoe UI';-inkscape-font-specification:'Segoe UI';text-align:start;text-anchor:start;white-space:pre;inline-size:300.316;display:inline;stroke-width:0.800658"
     x="391.21085"
     y="71.250725"
     id="text1"
     transform="translate(332.20729,-27.834916)"><tspan
       x="391.21085"
       y="71.250725"
       id="tspan19">Un <tspan
   style="font-weight:bold"
   id="tspan18">map</tspan> es una colección de pares de nombres (keys) y </tspan><tspan
       x="391.21085"
       y="85.262226"
       id="tspan20">valores (values). Lo podemos pensar como un array </tspan><tspan
       x="391.21085"
       y="99.273723"
       id="tspan21">asociativo. En lugar de acceder a los valores por un índice, </tspan><tspan
       x="391.21085"
       y="113.28522"
       id="tspan23">accedemos a través de un key. 
</tspan><tspan
       x="391.21085"
       y="127.29672"
       id="tspan24">Para declararlo, nuevamente debemos proveer un par de </tspan><tspan
       x="391.21085"
       y="141.30822"
       id="tspan25">tipos de dato.</tspan></text><text
     xml:space="preserve"
     style="font-size:11.2092px;line-height:1.25;font-family:'Segoe UI';-inkscape-font-specification:'Segoe UI';text-align:start;text-anchor:start;white-space:pre;inline-size:300.316;display:inline;stroke-width:0.800658"
     x="391.21085"
     y="71.250725"
     id="text22-5"
     transform="translate(398.36237,67.650968)"><tspan
       x="391.21085"
       y="71.250725"
       id="tspan29"><tspan
         style="font-weight:300;-inkscape-font-specification:'Segoe UI Light'"
         id="tspan28">map&lt;string, string&gt; traductor;
</tspan></tspan><tspan
       x="391.21085"
       y="85.262226"
       id="tspan31"><tspan
         style="font-weight:300;-inkscape-font-specification:'Segoe UI Light'"
         id="tspan30">map&lt;string, vector&lt;int&gt;&gt; lineas;</tspan></tspan></text><g
     id="g34"
     transform="translate(0,4.0039877)"><text
       xml:space="preserve"
       style="font-size:11.2092px;line-height:1.25;font-family:'Segoe UI';-inkscape-font-specification:'Segoe UI';text-align:start;text-anchor:start;white-space:pre;inline-size:300.316;display:inline;stroke-width:0.800658"
       x="391.21085"
       y="71.250725"
       id="text21"
       transform="translate(673.99412,-20.911262)"><tspan
         x="391.21085"
         y="71.250725"
         id="tspan38">Un <tspan
   style="font-weight:bold"
   id="tspan32">set</tspan> es como un <tspan
   style="font-weight:bold"
   id="tspan37">map</tspan>, en el sentido que contiene una lista </tspan><tspan
         x="391.21085"
         y="85.262226"
         id="tspan41">de keys, pero no contiene valores. Es decir, es una colección </tspan><tspan
         x="391.21085"
         y="99.273723"
         id="tspan42">de elementos únicos y ordenados de un determinado tipo. </tspan><tspan
         x="391.21085"
         y="113.28522"
         id="tspan44">También podemos pensarlo como un <tspan
   style="font-weight:bold"
   id="tspan43">vector</tspan> que no admite </tspan><tspan
         x="391.21085"
         y="127.29672"
         id="tspan45">valores duplicados.</tspan></text><text
       xml:space="preserve"
       style="font-size:11.2092px;line-height:1.25;font-family:'Segoe UI';-inkscape-font-specification:'Segoe UI';text-align:start;text-anchor:start;white-space:pre;inline-size:300.316;display:inline;stroke-width:0.800658"
       x="391.21085"
       y="71.250725"
       id="text22-5-3"
       transform="translate(764.82531,66.621375)"><tspan
         x="391.21085"
         y="71.250725"
         id="tspan47"><tspan
           style="font-weight:300;-inkscape-font-specification:'Segoe UI Light'"
           id="tspan46">set&lt;int&gt; teclasApretadas;</tspan></tspan></text></g><g
     id="g41"
     transform="translate(343.68654,4.0039877)"><text
       xml:space="preserve"
       style="font-size:11.2092px;line-height:1.25;font-family:'Segoe UI';-inkscape-font-specification:'Segoe UI';text-align:start;text-anchor:start;white-space:pre;inline-size:300.316;display:inline;stroke-width:0.800658"
       x="391.21085"
       y="71.250725"
       id="text39"
       transform="translate(683.56365,-19.097347)"><tspan
         x="391.21085"
         y="71.250725"
         id="tspan49">Un <tspan
   style="font-weight:bold"
   id="tspan48">struct</tspan> es una clase cuyo miembros son públicos por </tspan><tspan
         x="391.21085"
         y="85.262226"
         id="tspan50">defecto. Aunque podemos definir métodos, implementar </tspan><tspan
         x="391.21085"
         y="99.273723"
         id="tspan51">herencia y, de forma general, usar esta estructura de forma </tspan><tspan
         x="391.21085"
         y="113.28522"
         id="tspan52">equivalente a una clase, en la práctica se utiliza </tspan><tspan
         x="391.21085"
         y="127.29672"
         id="tspan53">frecuentemente para agrupar distintos tipos de datos bajo </tspan><tspan
         x="391.21085"
         y="141.30822"
         id="tspan54">un nombre. Podemos pensarlo como una solución para </tspan><tspan
         x="391.21085"
         y="155.31973"
         id="tspan55">problemas sencillos.</tspan></text><text
       xml:space="preserve"
       style="font-size:11.2092px;line-height:1.25;font-family:'Segoe UI';-inkscape-font-specification:'Segoe UI';text-align:start;text-anchor:start;white-space:pre;inline-size:300.316;display:inline;stroke-width:0.800658"
       x="391.21085"
       y="71.250725"
       id="text40"
       transform="translate(1133.6577,-11.776883)"><tspan
         x="391.21085"
         y="71.250725"
         id="tspan57"><tspan
           style="font-weight:300;-inkscape-font-specification:'Segoe UI Light'"
           id="tspan56">struct Particula
</tspan></tspan><tspan
         x="391.21085"
         y="85.262226"
         id="tspan59"><tspan
           style="font-weight:300;-inkscape-font-specification:'Segoe UI Light'"
           id="tspan58">{
</tspan></tspan><tspan
         x="391.21085"
         y="99.273723"
         id="tspan61"><tspan
           style="font-weight:300;-inkscape-font-specification:'Segoe UI Light'"
           id="tspan60">        ofVec2f pos;
</tspan></tspan><tspan
         x="391.21085"
         y="113.28522"
         id="tspan63"><tspan
           style="font-weight:300;-inkscape-font-specification:'Segoe UI Light'"
           id="tspan62">        float speed;
</tspan></tspan><tspan
         x="391.21085"
         y="127.29672"
         id="tspan65"><tspan
           style="font-weight:300;-inkscape-font-specification:'Segoe UI Light'"
           id="tspan64">        ofColor color;
</tspan></tspan><tspan
